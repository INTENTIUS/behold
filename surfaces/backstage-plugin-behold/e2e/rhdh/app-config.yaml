# App config for the local RHDH check in the README (e2e/rhdh/). The guest
# provider is a dynamic plugin in RHDH, enabled by dynamic-plugins.test.yaml.
app:
  title: Backstage Test App
  baseUrl: http://localhost:7007

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  database:
    client: better-sqlite3
    connection: ':memory:'
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:7007
    methods: [GET, POST, PUT, DELETE]
    credentials: true

auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

# Minimal catalog configuration.
catalog:
  rules:
    - allow: [Component, API, Group, User, Template, Location]
  locations:
    - type: file
      target: /opt/app-root/src/catalog-info.yaml

# This is required by the frontend app plugin for schema validation.
dynamicPlugins:
  # This directory is used by the backend to unpack OCI plugins.
  rootDirectory: /opt/app-root/src/dynamic-plugins-root
  # Disable the default directory scanning for local plugins
  sources:
    local: {}
    frontend: {}

# Add minimal analytics key to satisfy app bundle schema validation.
analytics: {}

# Disable the permission plugin for simplified testing.
permission:
  enabled: false

behold:
  exportUrl: http://localhost:4801/
