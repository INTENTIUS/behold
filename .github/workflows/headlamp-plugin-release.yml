name: headlamp-plugin-release

# Builds the Headlamp plugin in surfaces/headlamp-behold and attaches its
# tarball and checksum to a GitHub release. Artifact Hub reads the archive from
# the release URL in artifacthub-pkg.yml, so the build must reproduce the
# checksum that file names: the run fails when it does not.
#
# Tag: headlamp-behold-v<version> (distinct from the behold-v* npm tags).
on:
  push:
    tags: ["headlamp-behold-v*"]
  # Rehearse the build and the checksum check without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: surfaces/headlamp-behold
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run tsc
      - run: npm test
      - run: npm run build
      - name: Tarball matches artifacthub-pkg.yml
        run: node scripts/package.mjs --check
      - name: Package
        run: |
          # --check does not write; write the tarball and keep the yml as committed
          cp artifacthub-pkg.yml "$RUNNER_TEMP/pkg.yml"
          node scripts/package.mjs
          cmp artifacthub-pkg.yml "$RUNNER_TEMP/pkg.yml"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/headlamp-behold-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Headlamp plugin ${GITHUB_REF_NAME#headlamp-behold-v}" release/*.tar.gz release/*.tar.gz.sha256
