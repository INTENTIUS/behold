name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run tsc
      - name: unit tests
        run: npm test
        env:
          BEHOLD_REQUIRE_LADYBUG: '1'
      - name: icons module matches web/icons
        run: npm run check:icons
      - name: build
        run: npm run build
      # behold#1063: the root action.yml is the only metadata file and runs paths that exist.
      - name: action tree
        run: node scripts/action-tree.mjs
      - name: the viewer builds within its size budget
        run: npm run build:viewer
      - name: plugin files are in sync
        run: node plugins/sync.mjs --check
      - name: validate the Claude Code plugin and marketplace
        run: |
          npx -y @anthropic-ai/claude-code@2.1.325 plugin validate --strict --profile directory plugins/claude-code
          npx -y @anthropic-ai/claude-code@2.1.325 plugin validate --strict .
      - name: plugins stay out of the npm package
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e 'const f=JSON.parse(require("fs").readFileSync(0,"utf8"))[0].files.map(x=>x.path).filter(p=>p.startsWith("plugins/")||p.startsWith(".claude-plugin/")||p.startsWith(".cursor-plugin/")); if(f.length){console.error("packed:",f);process.exit(1)}'
      - name: the painter bundles for a browser
        run: npm run check:browser-bundle

