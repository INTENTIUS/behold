name: release

# Tag-driven, and published with npm trusted publishing — OIDC from this
# workflow rather than a long-lived NPM_TOKEN in repository secrets. npm mints
# a short-lived credential for this repo + this workflow filename, which means
# there is no token to leak, rotate, or scope wrongly.
#
# Two things have to line up outside this file:
#   1. npmjs.com → the package → Settings → Trusted Publisher, naming this
#      repository and `release.yml`. Until that exists the publish step fails
#      with a 404/403 rather than falling back to anything.
#   2. `id-token: write` below. Without it there is no OIDC token to exchange
#      and npm reports missing credentials.
#
# Provenance rides along automatically: publishing over OIDC attests what built
# the tarball, and `publishConfig.provenance` makes that explicit rather than
# implied.
on:
  push:
    # The repo's release-tag convention is behold-v<version> (behold-v0.1.0,
    # behold-v0.2.0 — chant's chant-v* shape). The original "v*" matched
    # neither, so this workflow had never once fired (#172).
    tags: ["behold-v*"]
  # Rehearse everything that can say no, without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gates the OIDC exchange behind an environment, so protection rules
    # (required reviewers, wait timers) can be attached in repo settings
    # without touching this file. The npm trusted-publisher record can also
    # name this environment to reject publishes from outside it.
    environment: release
    permissions:
      # The OIDC token npm exchanges for a publish credential. `contents: read`
      # is inherited from the top; both are needed and neither is enough alone.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No registry-url on purpose (pinhole's publish.yml learned this): with
      # it, setup-node writes an .npmrc pointing auth at NODE_AUTH_TOKEN — a
      # placeholder that overrides OIDC and 404s every publish even when the
      # trusted-publisher record exists. Without it, npm publish exchanges the
      # id-token via the package's trusted-publisher record.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships an npm 11,
      # but the exact patch moves with the runner image, so pin the floor here
      # rather than discover it on a tag.
      - name: npm with trusted publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Everything that can say no runs before the publish, in the order that
      # fails cheapest first.
      - name: typecheck
        run: npm run tsc

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # What actually ships, before it ships. `files` is bin + dist + web, and
      # web is the SPA — a tarball missing it publishes a server with no UI,
      # which would look fine here and break on install.
      - name: the tarball carries bin, dist and web
        # A REAL tarball listed with tar, not `pack --dry-run --json` parsed
        # with node — the JSON's `files` field is npm-version-dependent (absent
        # on the runner's npm 10, present on 11), which is how the first-ever
        # run of this workflow crashed with `undefined.files` (#172).
        run: |
          tarball="$(npm pack --silent | tail -1)"
          tar -tzf "$tarball" | sed 's|^package/||' > /tmp/pack-files
          node -e '
            const f = require("fs").readFileSync("/tmp/pack-files", "utf8").split("\n");
            const want = ["bin/behold.js", "dist/cli.js", "web/index.html", "web/app.js"];
            const missing = want.filter(w => !f.includes(w));
            if (missing.length) {
              console.error("tarball is missing:", missing.join(", "));
              process.exit(1);
            }
            console.log(`tarball: ${f.length} files, all four checked present`);
          '

      # The tag names the version, so a tag that disagrees with package.json
      # would publish something nobody asked for.
      - name: the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#behold-v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${pkg}" >&2
            exit 1
          fi
          echo "publishing ${pkg}"

      # Skip-if-published (pinhole's guard): a re-run of an already-published
      # tag goes green instead of dying on "cannot publish over" — the 0.2.2
      # first publish went out manually, and without this the tag's run can
      # never be green.
      - name: publish
        if: github.ref_type == 'tag'
        run: |
          V="$(node -p 'require("./package.json").version')"
          P="$(npm view "$(node -p 'require("./package.json").name')" version 2>/dev/null || echo none)"
          if [ "$V" = "$P" ]; then
            echo "@intentius/behold@$V already published, skipping"
          else
            npm publish
          fi

      # The official MCP Registry listing (behold#1050). It runs after the npm
      # publish because the registry reads mcpName from the published tarball.
      # Login is github-oidc: the id-token permission above is the same one npm
      # uses, and the token it yields grants io.github.<repository owner>/*, so
      # server.json's name has to carry the owner exactly as GitHub spells it
      # (the registry compares the prefix case-sensitively). The registry
      # refuses a version it already holds, so a re-run of a published tag
      # skips instead of failing. mcp-publisher is pinned and its Sigstore
      # bundle verified before it runs, as the registry's own workflow guide
      # does; move MCP_PUBLISHER_VERSION on purpose.
      - name: install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: list in the MCP Registry
        if: github.ref_type == 'tag'
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          name="$(node -p 'require("./server.json").name')"
          V="$(node -p 'require("./server.json").version')"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${name//\//%2F}/versions/${V}")"
          if [ "$code" = "200" ]; then
            echo "${name}@${V} is already in the registry, skipping"
            exit 0
          fi
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
