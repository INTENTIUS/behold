name: vscode-extension

# Builds, tests and packages the VS Code extension in surfaces/vscode-behold,
# and on a tag publishes the .vsix to the Visual Studio Marketplace and to
# Open VSX.
#
# Tag: vscode-behold-v<version> (distinct from behold-v* and
# headlamp-behold-v*). The tag must equal the version in the extension's
# package.json.
#
# Before the first tag a maintainer sets up the two registries, see
# surfaces/vscode-behold/PUBLISHING.md. Until then a tag builds, tests and
# attaches the .vsix to a GitHub release: the Marketplace job is skipped
# without its repository variable, and the Open VSX job says its secret is
# missing and passes.
#
# The viewer build needs a pinhole whose root entry bundles for a browser
# (pinhole 0.6.0, INTENTIUS/pinhole#133); on 0.5.0 `npm run build` stops at
# the viewer step.
on:
  push:
    tags: ["vscode-behold-v*"]
  pull_request:
    paths:
      - "surfaces/vscode-behold/**"
      - "src/viewer/**"
      - "scripts/build-viewer.mts"
      - "src/chant.ts"
      - ".github/workflows/vscode-extension.yml"
  # Rehearse build, tests and the size check without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: surfaces/vscode-behold
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: install the repository (the reader and the viewer are built from it)
        run: npm ci
        working-directory: .
      - run: npm ci
      - name: tag matches package.json
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "vscode-behold-v${v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${v}" >&2
            exit 1
          fi
      - run: npm run tsc
      - run: npm test
      - run: npm run build
      # Prints the VSIX size and fails above budget.json.
      - name: package
        run: npm run package
      # A real VS Code (the Extension Development Host), no `node` on PATH.
      - name: tests in VS Code
        run: xvfb-run -a npm run test:vscode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: behold-vsix
          path: surfaces/vscode-behold/*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/vscode-behold-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: behold-vsix
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "VS Code extension ${GITHUB_REF_NAME#vscode-behold-v}" ./*.vsix

  marketplace:
    # Trusted publishing: a short-lived Entra token from this run's OIDC
    # identity, no stored Marketplace token. Needs the repository variables
    # AZURE_CLIENT_ID and AZURE_TENANT_ID (PUBLISHING.md).
    if: startsWith(github.ref, 'refs/tags/vscode-behold-v') && vars.AZURE_CLIENT_ID != ''
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: behold-vsix
      - uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.1 publish --azure-credential --packagePath ./*.vsix

  open-vsx:
    # Open VSX takes an access token (a secret, OVSX_PAT) from an account that
    # has signed the Publisher Agreement and owns the namespace.
    if: startsWith(github.ref, 'refs/tags/vscode-behold-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-open-vsx
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: behold-vsix
      - name: publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set: Open VSX publishing is not set up yet (surfaces/vscode-behold/PUBLISHING.md)." >&2
            exit 0
          fi
          npx --yes ovsx@1.4.0 publish ./*.vsix -p "$OVSX_PAT"
