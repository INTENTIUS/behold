# behold changed cut on a Forgejo pull request (INTENTIUS/behold#1064).
# Copy to .forgejo/workflows/behold.yml. It runs the GitHub Action as it is,
# with the artifact steps swapped for Forgejo's own, because actions/upload-artifact
# v4 and later refuse a Forgejo server and `archive: false` needs them.
# forgejo/upload-artifact v5 is the first of its fork with the check that refuses
# a Forgejo server disabled; v4.3.1 fails with GHESNotSupportedError (checked on
# Forgejo 17.0.1).
#
# Pin every `uses` to a commit once you have chosen the versions.
name: behold
on: pull_request

jobs:
  draw:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: behold
        uses: https://github.com/INTENTIUS/behold@behold-v0.34.7
        with:
          forge: forgejo
          upload: "false"
          github-token: ${{ github.token }}
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        if: always() && steps.behold.outputs.out-dir != ''
        with:
          name: behold-changed
          path: ${{ steps.behold.outputs.out-dir }}
          if-no-files-found: ignore
