<!doctype html>
<html lang="en">

    <!-- behold#725: the stored theme, before the first frame. theme.js derives
         a theme in a module, which runs after the page has painted once, so a
         viewer's own theme would open on the default below for a moment.
         applyTheme() keeps what it last painted under behold.theme.paint; this
         applies that record when it belongs to the stored theme. A blocked or
         empty store leaves the default as it is. -->
    <script>
      try {
        var beholdTheme = localStorage.getItem("behold.theme");
        var beholdPaint = beholdTheme && JSON.parse(localStorage.getItem("behold.theme.paint") || "null");
        if (beholdPaint && beholdPaint.name === beholdTheme && beholdPaint.vars) {
          var beholdRoot = document.documentElement;
          for (var k in beholdPaint.vars) if (k.slice(0, 2) === "--") beholdRoot.style.setProperty(k, beholdPaint.vars[k]);
          if (beholdPaint.scheme) beholdRoot.style.setProperty("color-scheme", beholdPaint.scheme);
        }
      } catch (e) { /* private mode or a bad record: the default paints */ }
    </script>
    <title>behold · live demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23a6adc8' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='2.2' fill='%23a6adc8'/%3E%3C/svg%3E"

        --edge: #609113; --managed: #19cb00; --foreign: #cecb00; --pending: #0d73cc;
        --degraded: #cc0403; --neutral: #537c18; --runtime: #0dcdcd;
        --rule: #515e48; --focus: #577597; --active: #223f47; --well: #070f1c; --shadow: #030406;
        /* behold#571: the kiosk's surfaces and ink (theme.js kioskSurfaces), the kiosk's default theme's (KIOSK_THEME, Box since behold#758) until initTheme() runs. */
        --surface-box: #20242a; --surface-pane-a: #262a30; --surface-pane-b: #2c3036; --zebra: #9fef00; --soft: #9fef00; --muted-ink: #8aaa67;
        --managed-ink: #19cb00; --foreign-ink: #cecb00; --pending-ink: #2b83da; --degraded-ink: #e84234; --runtime-ink: #0dcdcd;
        /* behold#571: the left bars (theme.js barInks), Box's until initTheme() runs. */
        --bar-managed: #19cb00; --bar-foreign: #cecb00; --bar-pending: #3992ee; --bar-degraded: #ff5242; --bar-runtime: #0dcdcd; --bar-neutral: #719c3e;

         padding, margin and gap between a hairline and 1.25em takes the
         nearest one. --beat is the one period every looping animation runs on

      body { --fg: var(--soft); --muted: var(--muted-ink); --managed: var(--managed-ink); --foreign: var(--foreign-ink); --pending: var(--pending-ink); --degraded: var(--degraded-ink); --runtime: var(--runtime-ink); --zebra-row: color-mix(in srgb, var(--zebra) 3.5%, transparent); }

         the screen's width, so a TV reads it from across a room. */

      /* #569: the pipeline's runs (left), the selected run's jobs, steps and

      /* behold#571: each pane its own surface, a gap of the page between them.

      #stage { display: grid; grid-template-columns: minmax(15em, 18%) minmax(26em, 34%) minmax(0, 1fr); gap: 5px; padding: 0 5px; min-height: 0; background: var(--bg); }

      #k-runs-toggle { display: none; }
      /*
       * behold#571: the left bars. Every listed item (a run, a job, a step and

       * strip) has a bar down its left edge, so the eye can part the items

       * held in the waiting amber, failed, applied; neutral where it has none.
       * The selected item's bar, and a hover-linked one's, is twice as wide.
       * The zebra stays: on a calm theme the bars part the items, and the

      /* Rows that touch get a bar inset 2px top and bottom, so two of one state still read as two. */

      [data-k-tone="ok"] { --bar: var(--bar-managed); }
      [data-k-tone="bad"] { --bar: var(--bar-degraded); }
      [data-k-tone="idle"] { --bar: var(--bar-neutral); }
      .k-ap-lit { --bar: var(--bar-managed); }
      .k-ap-going { --bar: var(--bar-foreign); }
      .r-selected, .t-strip .t-row.t-sel, .r-open > .r-step-line, .r-open > .r-log { --bar-w: 6px; }
      .r-run:nth-child(even of .r-run), .r-job:nth-child(even of .r-job), .r-log-line:nth-child(even of .r-log-line) { background: var(--zebra-row); }
      /* behold#571: the panes step back from the lead block: quieter heads, lighter rules. */
      .r-side-head { padding: var(--s3) var(--s4) var(--s2); }
      .r-side-title { font-weight: 600; font-size: 0.95em; color: var(--muted); }
      .r-side-note { color: var(--ink2); font-size: 0.82em; margin-top: 0.15em; }
      .r-runs { list-style: none; margin: 0; padding: 0 0 var(--s4); }
      .r-group { font: 600 0.8em/1.3 var(--font-ui); color: var(--muted); padding: var(--s3) var(--s4) 0.25em; }
      .r-run { display: grid; grid-template-columns: 1.2em 1fr; gap: var(--s3); padding: var(--s2) var(--s4); cursor: pointer; }
      .r-run:hover { background: color-mix(in srgb, var(--active) 50%, transparent); }
      .r-run.r-selected { background: var(--active); }
      .r-run-title { font-weight: 600; line-height: 1.25; }
      .r-run-place { color: var(--muted); font-size: 0.85em; }
      .r-run-meta { display: flex; flex-wrap: wrap; gap: 0 var(--s3); color: var(--muted); font-size: 0.8em; }
      .r-icon { width: 1.15em; height: 1.15em; flex: none; margin-top: 0.15em; }
      .r-ok { color: var(--managed); } .r-bad { color: var(--degraded); } .r-wait { color: var(--foreign); } .r-busy { color: var(--foreign); } .r-idle { color: var(--neutral); }

      .r-head-title { display: flex; gap: var(--s2); align-items: center; font-weight: 600; font-size: 1em; }
      .r-head-title .r-icon { margin: 0; }
      .r-head-sub { color: var(--fg); font-size: 0.88em; margin-top: 0.15em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .r-head-meta { color: var(--muted); font-size: 0.82em; }
      .r-head-meta .r-origin { color: inherit; }

      .r-job { display: flex; gap: var(--s2); align-items: center; padding: 0.22em 1em 0.22em calc(1em + var(--depth, 0) * 0.9em); cursor: pointer; }
      .r-job .r-icon { margin: 0; }
      .r-job.r-selected { background: var(--active); }
      .r-job-name { font: 600 0.92em var(--font-mono); }
      .r-job-needs { color: var(--muted); font-size: 0.8em; }

      .r-job-name { white-space: nowrap; flex: none; }
      .r-job-tools { display: inline-flex; gap: var(--s3); font-size: 0.8em; color: var(--muted); white-space: nowrap; }
      .r-tool { display: inline-flex; align-items: center; gap: 0.25em; }
      .r-tool-icon { flex: none; }
      /* behold#571: each root's colour, as a dot by its name; never a text or fill colour, which mean a state. */

      .r-job-roots { display: inline-flex; gap: var(--s3); font-size: 0.82em; color: var(--fg); }
      .r-dur { margin-left: auto; color: var(--muted); font-size: 0.8em; white-space: nowrap; }
      .r-job-skipped { color: var(--muted); font-size: 0.8em; cursor: default; }

      .r-steps-head { flex: none; display: flex; gap: var(--s2); align-items: center; padding: var(--s1) var(--s4) var(--s1); }

      .r-steps-word { color: var(--muted); font-size: 0.85em; }
      .r-step-line { display: flex; gap: var(--s2); align-items: center; padding: 0.2em var(--s4); cursor: pointer; }
      .r-step-line .r-icon { margin: 0; width: 1em; height: 1em; }
      .r-caret { color: var(--muted); width: 0.8em; font-size: 0.8em; }
      .r-step-name { font-size: 0.88em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .r-open > .r-step-line { background: color-mix(in srgb, var(--active) 60%, transparent); }
      .r-log { margin: 0.2em var(--s3) var(--s2) 1.6em; padding: var(--s2) 0; background: var(--surface-pane-b); border-radius: 6px; font: 0.76em/1.45 var(--font-mono);
        white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; max-height: 52vh; min-height: 6em; }
      .r-log-line { display: grid; grid-template-columns: 3.2em 1fr; gap: var(--s4); padding: 0 var(--s4) 0 0; }
      .r-ln { color: var(--muted); text-align: right; user-select: none; opacity: 0.7; }

      .r-log-setup:hover { color: var(--fg); }
      .r-log-quiet .r-lt { color: var(--muted); }
      .r-log-cut { color: var(--muted); padding: 0 var(--s4) 0.2em 4em; font-style: italic; }
      .r-log-live { color: var(--foreign); padding-left: 4em; }

      @keyframes r-blink { 50% { opacity: 0; } }
      .r-note { color: var(--ink2); padding: 0 var(--s4); font-size: 0.88em; }
      /* behold#571: a log line's feature: an outlined chip on its first line in the job, a faint dot after; its note opens under the line. */

      .r-ann:hover, .r-ann:focus-visible { border-color: var(--focus); }
      .r-ann-dot { display: inline-block; width: 0.55em; height: 0.55em; padding: 0; margin-left: var(--s2); border-radius: 50%; border: 0; background: var(--muted); opacity: 0.55; cursor: pointer; vertical-align: 0.1em; }

      .r-ann-terragucci { border-color: color-mix(in srgb, var(--pending) 70%, transparent); }
      .r-ann-chant { border-color: color-mix(in srgb, var(--runtime) 70%, transparent); }
      .r-ann-choudoufu, .r-ann-behold { border-color: color-mix(in srgb, var(--foreign) 70%, transparent); }
      .r-ann-dot.r-ann-terragucci { background: var(--pending); } .r-ann-dot.r-ann-chant { background: var(--runtime); }
      .r-ann-note { grid-column: 2; margin: 0.25em 0 var(--s2); padding: var(--s2) var(--s3); border-left: 3px solid var(--focus); background: var(--surface-box); border-radius: 0 6px 6px 0; font: 1.12em/1.4 var(--font-ui); white-space: normal; }
      .r-ann-note-head { font: 600 0.8em var(--font-ui); color: var(--muted); border: 0; }
      .r-ann-note-text { margin: 0.15em 0 0.2em; color: var(--fg); }
      .r-ann-more { color: var(--pending); }
      .r-flash { background: color-mix(in srgb, var(--focus) 30%, transparent) !important; }
      @media (prefers-reduced-motion: no-preference) { .r-flash { transition: background 0.6s; } }
      /* behold#571: folded, whole lines only (fitFeatures); opened, it scrolls inside a bounded box. */

      .r-feats-open .r-feats-list { max-height: 12em; overflow-y: auto; scrollbar-width: thin; }
      .r-feats-label { padding: var(--s1) 0 0.15em; }
      .r-feats-list { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s1); align-items: center; }
      .r-feats-list > [hidden] { display: none; }
      .r-feats-product { font: 600 0.8em var(--font-ui); color: var(--muted); border: 0; margin: 0 0.15em 0 var(--s2); }
      .r-feats-product:first-child { margin-left: 0; }
      .r-feat, .r-feats-more { font: 0.8em var(--font-ui); line-height: 1.4; color: var(--fg); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 0.05em var(--s3); cursor: pointer; }
      .r-feats-more { color: var(--pending); border-style: dashed; }
      .r-feat:hover, .r-feat:focus-visible { border-color: var(--focus); background: var(--zebra-row); }
      /*
       * behold#571: the header in fixed boxes. The lead block on the left is
       * the page's lead: the title, the two beats (what changes, and the step:
       * what just happened and why), the progress, the rest of the card and
       * the pull request's facts, each in a box whose height holds its text
       * budget at 1440x900 and 1920x1080 (terragucci#1061: the card's fields
       * 120, 220 and 120 characters, the step 200). More scrolls inside the
       * box, with a fade at the edge, so the panes below never move. The hold
       * panel on the right takes the lead's height and never sets it.
       */
      #bar { position: relative; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s2) var(--s3); align-items: stretch;
        padding: var(--s1) var(--s3) var(--s1); background: var(--bg); }
      #bar > .k-empty, #bar > .k-replay, #bar > .k-nograph-note { grid-column: 1 / -1; }
      /*
       * behold#571: the lead block is a grid of labelled rows. A quiet line
       * (the tool, the kicker, the scenario's progress) over the title, then
       * one beat a row: what changes, the step, next, watch for, shows and the
       * pull request's facts. Each label sits in a fixed column and the words
       * in the next, at most 72ch wide, so a wrapped line hangs under the
       * words and never under the label. Each row is a fixed box (it scrolls,
       * with a fade, inside it) with a rail down its left: neutral, and the
       * step's rail in the step's state colour (theme.js barInks).
       */

      .k-lead { display: grid; grid-template-rows: var(--k-title-h) var(--k-beat-h) var(--k-step-h) var(--k-next-h) var(--k-watch-h) var(--k-shows-h) var(--k-facts-h) auto; gap: 0.2em; min-width: 0;
        padding: 0.25em var(--s4) var(--s1); background: var(--surface-pane-b); border-radius: 8px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 14%, transparent); }

      .k-box.k-more-below { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 1.3em), transparent); }
      .k-box.k-more-above { -webkit-mask-image: linear-gradient(to top, #000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(to top, #000 calc(100% - 1.3em), transparent); }
      .k-box.k-more-above.k-more-below { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 1.3em, #000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(to bottom, transparent, #000 1.3em, #000 calc(100% - 1.3em), transparent); }
      .k-box-empty { background: transparent; box-shadow: none; }
      .k-cycle { color: var(--muted); font: 0.78em var(--font-mono); white-space: nowrap; }
      .k-muted { color: var(--ink2); margin: 0.25em 0; }
      .k-stop { font: 0.78em var(--font-mono); padding: 0.18em var(--s3); border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
      .k-done { color: var(--fg); border-color: var(--managed); }
      .k-current { color: var(--bg); background: var(--pending); border-color: var(--pending); font-weight: 600; }
      .k-failed { color: var(--bg); background: var(--degraded); border-color: var(--degraded); font-weight: 600; }
      .k-when { color: var(--foreign); font-family: var(--font-mono); }
      .k-box-title { overflow: hidden; padding: 0; }
      .k-overline { display: flex; align-items: center; gap: var(--s1) var(--s4); min-width: 0; height: 1.4em; overflow: hidden; }
      .k-overline .k-brand { margin: 0; font-size: 0.9em; }
      /* behold#725: in rem, so the kicker keeps one size beside the overline's and the caption's larger title. */
      .k-kicker { display: inline-block; font: 600 0.8rem var(--font-ui); color: var(--muted); margin-right: var(--s4); vertical-align: 0.3em; white-space: nowrap; }
      .k-overline .k-kicker { margin: 0; vertical-align: 0; }
      .k-overline .k-strip { margin-left: auto; }
      .k-strip { list-style: none; display: flex; flex-wrap: nowrap; gap: var(--s1); padding: 0; margin: 0; }
      .k-overline .k-stop { font-size: 0.7em; }
      .k-title { margin: 0; font-size: 1.45em; line-height: 1.15; text-wrap: balance; overflow: hidden; }
      .k-row { display: grid; grid-template-columns: var(--k-label-w) minmax(0, 1fr); column-gap: var(--s4); min-height: 0; padding-left: var(--s3); box-shadow: inset 3px 0 0 var(--bar, var(--bar-neutral)); }
      .k-row-empty { box-shadow: none; }
      .k-row-label { font: 600 0.8em/1.3 var(--font-ui); color: var(--muted); padding-top: var(--s2); overflow-wrap: normal; }
      .k-row-box { padding: 0 0.2em 0 0; border-radius: 0; }
      .k-row-box > p { margin: 0; max-width: 72ch; text-wrap: pretty; overflow-wrap: normal; }

      .k-beat, .k-step, .k-intro { font-size: 1.12em; line-height: 1.3; font-weight: 500; color: var(--fg); }
      .k-row-step { box-shadow: inset 5px 0 0 var(--bar, var(--bar-neutral)); }
      .k-row-step .k-row-label { color: var(--bar, var(--muted)); }
      /* Next, watch for and shows: smaller, quieter. */
      .k-next, .k-about { font-size: 0.9em; line-height: 1.35; color: var(--ink2); }
      .k-row-next .k-row-label, .k-row-more .k-row-label { padding-top: var(--s1); }
      .k-action { font-family: var(--font-mono); color: var(--fg); }
      .k-when { color: var(--foreign); font-family: var(--font-mono); }
      .k-next-by { color: var(--muted); }
      /*
       * behold#571: the bar under "next, by the driver", in both layouts: how far the driver's wait
       * has gone (kiosk.js nextProgress), in the step's tone (theme.js barInks, 3:1 in every theme).
       * It is placed, never in the flow, so no row moves when it comes or goes. At the deadline it
       * pulses until the step changes; with no deadline a quiet shimmer runs. Under reduced motion
       * the due bar is steady and full, and there is no shimmer.
       */
      /* behold#694: the bar has its own track below the words, with room between, never an underline of them. */
      .k-row-next { position: relative; padding-bottom: calc(0.45em + 4px); }
      .k-nbar { position: absolute; left: calc(var(--s3) + var(--k-label-w) + var(--s4)); right: 0.2em; bottom: 0; height: 4px; border-radius: 2px; overflow: hidden; pointer-events: none;
        background: color-mix(in srgb, var(--muted) 22%, transparent); }
      .k-nbar-none { display: none; }
      .k-nbar-in { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--k-nbar-fill, 0) * 100%); border-radius: inherit; background: var(--bar, var(--bar-neutral)); }
      .k-nbar-due .k-nbar-in { width: 100%; }
      .k-nbar-wait { background: transparent; }
      .k-nbar-wait .k-nbar-in { width: 30%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bar, var(--bar-neutral)) 60%, transparent), transparent); }
      @media (prefers-reduced-motion: no-preference) {
        .k-nbar-due .k-nbar-in { animation: k-nbar-pulse calc(var(--beat) * 2) ease-in-out var(--k-nbar-phase, 0ms) infinite; }
        .k-nbar-wait .k-nbar-in { animation: k-nbar-sweep calc(var(--beat) * 2) linear var(--k-nbar-phase, 0ms) infinite; }
      }
      @media (prefers-reduced-motion: reduce) { .k-nbar-wait { display: none; } }
      @keyframes k-nbar-pulse { 50% { opacity: 0.5; } }
      @keyframes k-nbar-sweep { from { transform: translateX(-100%); } to { transform: translateX(334%); } }
      /* The pull request's facts, smallest: each part a chip that wraps whole, never cut off. */
      .k-row-facts .k-row-label { padding-top: 0.25em; }
      .k-row-box > p.k-facts { display: flex; flex-wrap: wrap; gap: 0 var(--s2); max-width: none; font-size: 0.84em; line-height: 1.45; color: var(--fg); }
      .k-fact:not(:last-child)::after { content: "\00B7"; color: var(--muted); margin-left: var(--s2); }
      .k-credits { margin: 0; color: var(--muted); font-size: 0.8em; line-height: 1.35; }
      /* behold#571: the hold panel, lit in the waiting tone its job row and its wave box carry. */
      .k-right { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--s1); min-width: 0; min-height: 0; contain: size; }
      /* behold#571: the cycle line sits under the header's controls (#688 made them full size), not beneath them. */
      .k-right > .k-cycle { margin: 0; padding: 2.6em var(--s1) 0; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .k-box-hold { padding: var(--s2) var(--s4) var(--s3); }
      /* behold#725: beside the lead block, so on the lead block's level. */
      .k-hold { background: var(--surface-pane-b); border-radius: 8px; }
      .k-hold-head { margin: 0 0 var(--s1); font: 700 0.95em var(--font-mono); color: var(--fg); }
      .k-hold-wave { background: color-mix(in srgb, var(--foreign) 7%, var(--surface-pane-b)); box-shadow: inset 6px 0 0 var(--bar-foreign); padding-left: var(--s5); }
      .k-hold-wave .k-hold-head { color: var(--foreign); }
      .k-hold > .k-note { margin-top: 0.2em; }
      /* behold#571: "How this hold ends": four rows that light from the records. */
      .k-ap-head { font: 600 0.8em var(--font-ui); color: var(--muted); margin: 0 0 0.1em; }
      .k-ap-head .k-ap-plan { color: var(--fg); font-weight: 400; }
      .k-ap-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.05em; }
      .k-ap-row { display: grid; grid-template-columns: 1em 6.4em minmax(0, 1fr); gap: 0 var(--s1); align-items: baseline; font-size: 0.84em; line-height: 1.28; padding: 0.12em 0 0.12em var(--s3); }
      .k-ap-mark { width: 0.75em; height: 0.75em; border-radius: 50%; border: 2px solid var(--muted); display: inline-block; align-self: start; margin-top: 0.25em; }
      .k-ap-lit .k-ap-mark { background: var(--managed); border-color: var(--managed); }
      .k-ap-going .k-ap-mark { border-color: var(--foreign); background: linear-gradient(90deg, var(--foreign) 50%, transparent 50%); }
      .k-ap-label { font: 600 0.82em var(--font-ui); color: var(--fg); }
      .k-ap-dim .k-ap-label, .k-ap-dim .k-ap-text { color: var(--muted); }
      .k-ap-facts { color: var(--muted); font-size: 0.92em; margin-left: var(--s1); }
      .k-ap-bad { color: var(--degraded); }
      .k-ap-row .k-command { grid-column: 3; margin: 0.1em 0; padding: 0.25em var(--s3); font-size: 0.92em; }
      .k-ap .r-ann { font-size: 0.78em; }
      .k-approve p { margin: 0.15em 0; }
      .k-approve-gloss { color: var(--fg); font-size: 0.92em; }
      .k-approve-then { color: var(--ink2); font-size: 0.92em; }
      .k-command { display: block; margin: 0.25em 0; padding: var(--s2) var(--s3); background: var(--well); border-radius: 6px; font: 0.88em var(--font-mono); overflow-wrap: anywhere; user-select: none; }
      .k-inline { font-family: var(--font-mono); color: var(--fg); background: var(--well); padding: 0.05em var(--s1); border-radius: 4px; user-select: none; }
      .k-note { color: var(--ink2); margin: 0; font-size: 0.92em; }
      .k-unknown { color: var(--foreign); }
      #view-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
      #view { display: block; width: 100%; flex: 1; min-height: 0; border: 0; background: var(--bg); }
      /* #571: the toggle between the two views, over the frame by the view's caption. */
      #views { display: flex; align-items: center; gap: var(--s4); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--rule); background: var(--surface-pane-a); border-radius: 6px 6px 0 0; }
      #views[hidden] { display: none; }
      .k-views { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
      .k-view { font: 600 0.85em var(--font-ui); color: var(--muted); background: transparent; border: 0; padding: var(--s1) var(--s4); cursor: pointer; }
      .k-view + .k-view { border-left: 1px solid var(--rule); }
      .k-view:hover { color: var(--fg); }
      .k-view-on { color: var(--bg); background: var(--pending); }
      .k-view-on:hover { color: var(--bg); }
      .k-view-note { color: var(--muted); font-size: 0.8em; }
      /* behold#571: "How to read this", the graph pane's static frame: the legend of the view shown, folded to its header on request. */
      #view-pane { position: relative; }
      /* No frame has drawn yet on this page (a reload, a load in place): the pane is dark and says so, never an empty box. */
      #view-pane::after { content: "Drawing the graph..."; position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); font: 600 1.1em var(--font-ui); pointer-events: none; }
      body.k-framewait #view-pane::after { display: flex; }
      #views { padding-right: 11em; }
      /* Folded, its header sits in the toggle's row; open, its rows lie over the top of the graph, two to a line. */
      #k-read { font-size: 0.82em; }
      #k-read[hidden] { display: none; }
      .k-read-head { position: absolute; top: 0.55em; right: 1.1em; z-index: 5; font: 600 0.82em var(--font-ui); color: var(--muted); background: transparent; border: 0; padding: var(--s1) 0; cursor: pointer; }
      .k-read-head::after { content: " ▸"; }
      .k-read-open .k-read-head::after { content: " ▾"; }
      .k-read-head:hover { color: var(--fg); }
      .k-read-rows { position: absolute; top: 2.85em; left: 0.7em; right: 0.7em; z-index: 4; list-style: none; margin: 0; padding: var(--s2) var(--s4); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.25em 1.4em;
        background: var(--surface-pane-b); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 22px color-mix(in srgb, var(--shadow) 60%, transparent); }
      .k-read-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: var(--s2); align-items: center; color: var(--fg); line-height: 1.3; }
      .k-read-mark { display: inline-block; justify-self: center; }
      .k-read-card { width: 1.7em; height: 0.95em; border-radius: 3px; background: var(--panel); box-shadow: inset 3px 0 0 var(--muted); border: 1px solid var(--edge); }
      .k-read-box { width: 1.9em; height: 1.05em; border-radius: 4px; border: 1.5px solid var(--muted); }
      .k-read-solid, .k-read-dashed { width: 2em; height: 0; border-top: 2px solid var(--fg); }
      .k-read-dashed { border-top-style: dashed; }
      .k-read-hole { width: 1.9em; height: 1.05em; border-radius: 4px; border: 2px dashed var(--degraded); }
      .k-read-previewed { width: 1.9em; height: 0.8em; border-radius: 0.4em; border: 1.5px solid var(--pending); }
      .k-read-order { width: 1.9em; height: 1em; background: linear-gradient(var(--muted), var(--muted)) 0 0 / 0.5em 100% no-repeat, linear-gradient(var(--muted), var(--muted)) 0.7em 25% / 0.5em 75% no-repeat, linear-gradient(var(--muted), var(--muted)) 1.4em 50% / 0.5em 50% no-repeat; opacity: 0.8; }
      .k-read-marks { width: 1.5em; height: 0.75em; background: radial-gradient(circle at 25% 50%, var(--foreign) 0 0.3em, transparent 0.32em), radial-gradient(circle at 75% 50%, var(--runtime) 0 0.3em, transparent 0.32em); }
      /* behold#571: a tool's page. Its name (and logo where allowed) before the scenario, the replay's banner, the credit. */
      .k-brand { display: inline-flex; align-items: center; gap: var(--s1); margin-right: var(--s4); color: var(--fg); text-decoration: none; font-weight: 700; vertical-align: 0.05em; }
      .k-brand:hover .k-brand-name { text-decoration: underline; }
      .k-brand-logo { width: 1.25em; height: 1.25em; }
      .k-replay { margin: 0; padding: 0.2em var(--s3); padding-right: 16em; border-left: 4px solid var(--neutral); background: var(--surface-box); color: var(--fg); font-size: 0.92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* behold#571: "What is this?" and the theme, at the header's top right, outside the boxes that redraw. */
      #k-tools { position: absolute; top: 0.35em; right: 1em; z-index: 5; display: flex; gap: var(--s3); align-items: center; font-size: 1em; }
      /* behold#571: the header's controls read as controls: one pill shape, full-size type. */
      .k-pill, .k-menu summary, .eh-switch { display: inline-flex; align-items: center; gap: var(--s2); height: 2em; padding: 0 var(--s4); border: 1px solid var(--rule); border-radius: 999px; background: var(--surface-pane-a); color: var(--fg); font: 600 0.92em var(--font-ui); cursor: pointer; }
      .k-menu summary:hover, .eh-switch:hover { border-color: var(--focus); }
      .eh-switch input { accent-color: var(--pending); margin: 0; width: 1em; height: 1em; }
      .k-what { font: 600 0.92em var(--font-ui); color: var(--pending); background: transparent; border: 0; padding: 0.1em 0.2em; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      #k-what-pop { position: absolute; top: 1.8em; right: 0; width: min(34em, calc(100vw - 32px)); padding: var(--s3) var(--s4); background: var(--surface-pane-b); color: var(--fg); border: 1px solid var(--focus);
        border-radius: 8px; box-shadow: 0 6px 24px color-mix(in srgb, var(--shadow) 70%, transparent); font-size: 1.15em; line-height: 1.45; }
      /* behold#764: never past the window's bottom on a short screen: it scrolls. */
      #k-what-pop { max-height: calc(100vh - 4em); overflow-y: auto; overscroll-behavior: contain; }
      #k-what-pop[hidden] { display: none; }
      #k-what-pop p { margin: 0; }
      #k-what-pop .k-what-more { margin-top: var(--s2); }
      #k-what-pop a { color: var(--focus); }
      .k-menu summary { list-style: none; gap: 0; }
      .k-menu summary::-webkit-details-marker { display: none; }
      .k-menu summary::after { content: " ▾"; }
      .k-menu[open] summary { border-color: var(--focus); }
      .k-menu-body { position: absolute; right: 0; top: 2.4em; padding: var(--s2); background: var(--surface-pane-b); border: 1px solid var(--rule); border-radius: 8px; }
      /* behold#755: the picker between its < and > arrows. behold#783: all three in one pill, so < and > read as
         the theme's own arrows and never as a step back or forward. */
      .k-theme-step { position: relative; display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface-pane-a); }
      .k-theme-step:hover, .k-theme-step:has(.k-menu[open]) { border-color: var(--focus); }
      .k-theme-arrow { display: inline-flex; align-items: center; justify-content: center; width: 1.9em; height: calc(2em - 2px); padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: 600 0.92em var(--font-ui); cursor: pointer; }
      .k-theme-arrow:hover, .k-theme-arrow:focus-visible { color: var(--fg); background: var(--active); }
      .k-theme-step .k-menu summary { height: calc(2em - 2px); padding: 0 var(--s3); border: 0; border-radius: 0; background: transparent; box-shadow: inset 1px 0 0 var(--rule), inset -1px 0 0 var(--rule); }
      .k-credit { color: var(--muted); }
      .k-credit-link { color: var(--fg); }
      .k-nograph-note { margin: 0; color: var(--ink2); font-size: 0.88em; }
      /* With no graph to show, the graph pane folds away and the runs and the log take its width. */
      body.k-nograph #stage { grid-template-columns: minmax(15em, 22%) minmax(0, 1fr); }
      body.k-nograph #view-pane { display: none; }
      /* behold#571: before the tool's first cycle, no runs and no log: those panes fold away, the repo's graph takes the width, or nothing shows below the header. */
      body.k-notyet #runs-side, body.k-notyet #runs-main, body.k-notyet #k-runs-toggle { display: none !important; }
      body.k-notyet #stage { grid-template-columns: minmax(0, 1fr); }
      .k-fact { color: var(--fg); }
      @media (max-width: 900px) and (min-width: 601px) { #bar { grid-template-columns: 1fr; } .k-right { contain: none; } .k-box-hold { max-height: 16em; } #stage, body.k-nograph #stage { grid-template-columns: 1fr; } }
      /*
       * behold#571: a phone. One column that scrolls as a page: the header
       * (its boxes as tall as their text), the graph, then the runs and their
       * logs behind "Runs and logs". Nothing wider than the screen.
       */
      @media (max-width: 600px) {
        html, body { height: auto; overflow-x: hidden; overflow-y: auto; font-size: 14px; }
        body { display: block; }
        #bar { display: block; padding: var(--s2) 16px var(--s3); }
        #bar > * + * { margin-top: var(--s2); }
        .k-left, .k-right { display: block; contain: none; }
        .k-left > * + *, .k-right > * + * { margin-top: var(--s2); }
        .k-box { height: auto; max-height: none; overflow: visible; -webkit-mask-image: none !important; mask-image: none !important; }
        .k-box-empty { display: none; }
        .k-title { font-size: 1.4em; }
        .k-overline { flex-wrap: wrap; height: auto; overflow: visible; }
        .k-overline .k-strip { margin-left: 0; flex: 1 1 100%; }
        .k-row { grid-template-columns: minmax(0, 1fr); row-gap: 0.1em; padding: 0.1em 0 0.1em var(--s3); }
        .k-row-empty { display: none; }
        .k-row-label { padding-top: 0; }
        .k-nbar { left: var(--s3); right: 0; }
        .k-row-next { padding-bottom: calc(0.45em + 4px); }
        #views { flex-wrap: wrap; gap: var(--s1) var(--s4); }
        .k-strip { flex-wrap: wrap; }
        .k-right > .k-cycle { padding: 0; }
        #k-read { padding: 0.2em 16px; }
        .k-read-head { position: static; }
        .k-read-rows { position: static; grid-template-columns: 1fr; border-radius: 6px; box-shadow: none; margin-bottom: var(--s1); }
        #views { padding-right: var(--s4); }
        .k-replay { padding-right: var(--s3); white-space: normal; }
        #k-tools { position: static; justify-content: flex-end; flex-wrap: wrap; row-gap: var(--s2); margin: 0; padding: var(--s2) 16px 0; }
        .k-theme-n { display: none; }
        .k-what { white-space: nowrap; }
        /* behold#777: over the title and the step bar, which come later in the page and are placed. */
        #k-what-pop { right: 16px; left: 16px; width: auto; top: 2.2em; z-index: 45; }
        .k-ap-row { grid-template-columns: 1.1em 5.6em minmax(0, 1fr); }
        #stage, body.k-nograph #stage { display: flex; flex-direction: column; padding: 0; gap: 0; }
        #view-pane { order: 1; height: 64vh; }
        #view-pane:has(#k-read.k-read-open) { height: auto; }
        #view-pane:has(#k-read.k-read-open) #view { height: 56vh; flex: none; }
        body.k-nograph #view-pane { display: none; }
        #k-runs-toggle { order: 2; display: block; margin: var(--s3) 16px; padding: var(--s3) var(--s4); font: 600 1em var(--font-ui); color: var(--fg); background: var(--surface-pane-b); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; text-align: left; }
        #k-runs-toggle::after { content: " ▸"; }
        body.k-runs-open #k-runs-toggle::after { content: " ▾"; }
        #runs-side { order: 3; display: none; max-height: 50vh; border-radius: 0; }
        #runs-main { order: 4; display: none; height: 85vh; border-radius: 0; }
        body.k-runs-open #runs-side, body.k-runs-open #runs-main { display: flex; flex-direction: column; }
        body.k-runs-open #runs-side { display: block; }
        /* behold#771: in Watch the pane is the drawer's log, open with the drawer and not with the runs toggle. */
        #k-drawer .k-drawer-body #runs-main { display: flex; height: auto; }
        /* behold#780: a job row wraps on a phone: its roots go to the next line, each name whole, instead of past the screen's edge. */
        .r-job { flex-wrap: wrap; row-gap: 0.1em; }
        .r-job-roots { flex-wrap: wrap; gap: 0 var(--s3); flex: 1 1 10em; min-width: 0; }
        .r-job-roots .k-root { white-space: nowrap; }
        .r-log { margin-left: var(--s2); max-height: 60vh; }
        .r-log-line { grid-template-columns: 2.4em 1fr; gap: var(--s2); }
        .r-ann-note { grid-column: 1 / -1; }
      }

      /*
       * behold#571: Watch, the default. The Components graph fills the stage,
       * and the rest rides on it: the caption along the bottom, the approval
       * a callout on the held wave's box, the running job's log a drawer from
       * the active wave's box, each wave's numbers a badge on its box, the
       * result a card at the end. The header is one quiet line. Inspect is
       * the layout above, one click away.
       */
      .k-modes { display: inline-flex; height: 2em; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--surface-pane-a); }
      .k-mode { font: 600 0.92em var(--font-ui); color: var(--muted); background: transparent; border: 0; padding: 0 var(--s5); cursor: pointer; }
      .k-mode + .k-mode { border-left: 1px solid var(--rule); }
      .k-mode:hover { color: var(--fg); }
      .k-mode-on, .k-mode-on:hover { color: var(--bg); background: var(--pending); }
      #k-watch { display: none; }
      body.k-watch #k-watch { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 6; }
      body.k-watch #k-watch > * { pointer-events: auto; }
      body.k-watch { grid-template-columns: minmax(0, 1fr); }
      body.k-watch #stage { display: block; position: relative; padding: 0 5px 5px; }
      body.k-watch #runs-side, body.k-watch #k-metrics, body.k-watch #k-runs-toggle, body.k-watch #views, body.k-watch #k-read { display: none !important; }
      body.k-watch #view-pane { position: absolute; inset: 0 5px 5px; border-radius: 8px; overflow: hidden; background: var(--bg); }
      body.k-watch #view { height: 100%; }
      /* The header, one line: the scenario's place, the steps, the delivery numbers. */
      /* The header and the controls share one row: the header takes what the controls leave and wraps inside it, so nothing runs under them at any width. */
      body.k-watch #bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s5); min-width: 0; min-height: 2.6em; padding: var(--s1) var(--s4); }
      @media (min-width: 901px) {
        body.k-watch #k-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
        body.k-watch #k-head > .k-link { grid-row: 1; grid-column: 1 / -1; }
        body.k-watch #bar { grid-row: 2; grid-column: 1; }
        body.k-watch #k-tools { grid-row: 2; grid-column: 2; position: relative; top: auto; right: auto; padding: 0.35em 1em 0.35em 0; flex-wrap: wrap; justify-content: flex-end; row-gap: var(--s2); }
      }
      /* The place truncates and the steps wrap before either reaches the controls; with no room left on the line, the steps take a line of their own. */
      .k-w-place { display: flex; align-items: baseline; gap: var(--s3); flex: 0 1 auto; min-width: 0; white-space: nowrap; }
      .k-w-place .k-brand { flex: none; }
      .k-w-place .k-cycle { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      body.k-watch #bar .k-strip { flex: 0 1 auto; flex-wrap: wrap; row-gap: var(--s1); min-width: 0; }

        {
          bar: document.getElementById("bar"), frame: document.getElementById("view"), read: document.getElementById("k-read"), side: document.getElementById("runs-side"), main: document.getElementById("runs-main"), views: document.getElementById("views"),
          tools: { what: document.querySelector(".k-what"), pop: document.getElementById("k-what-pop"), theme: document.getElementById("k-theme"), runsToggle: document.getElementById("k-runs-toggle"), mode: document.getElementById("k-mode") },
          eh: { switchHost: document.getElementById("k-tools"), trailHost: document.getElementById("eh-trail"), tipsHost: document.getElementById("eh-tips"), modalHost: document.getElementById("eh-modals") },
          watch: { layer: document.getElementById("k-watch"), caption: document.getElementById("k-caption"), change: document.getElementById("k-change"), waves: document.getElementById("k-waves"), callout: document.getElementById("k-callout"), ask: document.getElementById("k-ask"), side: document.getElementById("k-side"), sideTab: document.getElementById("k-side-tab"), drawer: document.getElementById("k-drawer"), badges: document.getElementById("k-badges"), result: document.getElementById("k-result") },
        },
        { tool: pageTool(document), source: pageSource(document), runs: pageRuns(document) },
      );
      // The banner: the title and act, the live demo's products and its code. One poll of demo.json (every 3 s) moves it
      // when the loop goes from one demo to the next; no tabs, no replay.
      {
        const host = document.getElementById("k-banner");
        let tool = pageTool(document);
        const served = tool;
        let act = null;
        const draw = () => drawBanner(host, bannerModel(tool, act));
        draw();
        const shouldReload = () => {
          try {
            const last = Number(sessionStorage.getItem("k-demo-reload") || 0);
            if (Date.now() - last < 30000) return false;
            sessionStorage.setItem("k-demo-reload", String(Date.now()));
          } catch { /* no storage: reload anyway */ }
          return true;
        };
        const read = () =>
          fetch("/api/terragucci/demo", { cache: "no-store" })
            .then((r) => (r.ok ? r.json() : null))
            .then((d) => {
              const t = liveTool(d) || tool;
              const a = actOf(t, d);
              if (t !== tool || a !== act) { tool = t; act = a; draw(); }
              // The loop moved to another demo: the graph, pane and runs belong to the demo the page was served for, so
              // load `/`, which serves the live one (once per 30 s at most, so a flapping read can't loop).
              if (served && t !== served && shouldReload()) location.reload();
            })
            .catch(() => {});
        read();
        setInterval(read, 3000);
      }
      // behold#571: the repo's numbers from Prometheus, a pane of its own in Inspect (web/kiosk-metrics.js), and Watch's badges and delivery line.
      import("/kiosk-metrics.js").then((m) => m.startMetrics(document.getElementById("k-metrics"), { tool: pageTool(document), reads: readsFor(pageSource(document)), onModel: (model) => kiosk.setMetrics(model) }));
    </script>
  </body>
</html>
