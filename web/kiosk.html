<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>behold kiosk</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23a6adc8' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='2.2' fill='%23a6adc8'/%3E%3C/svg%3E"
    />
    <style>
      /* #569 step 2. The pre-paint fallback is index.html's: the default
         theme's tokens, which initTheme() replaces with the viewer's theme. */
      :root {
        --bg: #1e1e2e; --panel: #2e2f40; --line: #3b3c4a; --fg: #cdd6f4; --muted: #777a8c;
        --edge: #56596d; --managed: #a6e3a1; --foreign: #f9e2af; --pending: #89b4fa;
        --degraded: #f38ba8; --neutral: #6d7187; --runtime: #94e2d5;
        --rule: #4e4f64; --focus: #a3b4d0; --active: #3d4660; --well: #11101f; --shadow: #050507;
        --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      /* #569 step 3: one screen. The bar is the narration, the frame is
         behold's own view of the change, the foot is the plan's facts. Sizes
         follow the screen's width, so a TV reads it from across a room. */
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: clamp(14px, 0.95vw, 22px)/1.4 var(--font-ui); overflow: hidden; }
      body { display: grid; grid-template-rows: auto 1fr auto; }
      #bar { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.6em; align-items: start;
        padding: 1em 1.6em 0.9em; background: var(--panel); border-bottom: 1px solid var(--rule); }
      #bar > .k-empty { grid-column: 1 / -1; }
      .k-kicker { display: flex; gap: 1.2em; font: 600 0.78em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .k-cycle { text-transform: none; letter-spacing: 0; font-weight: 400; }
      .k-title { margin: 0.1em 0 0.35em; font-size: 1.75em; line-height: 1.15; }
      .k-muted { color: var(--muted); margin: 0.25em 0; }
      .k-step { border-left: 4px solid var(--pending); padding: 0.1em 0 0.1em 0.8em; }
      .k-step-word { font: 600 0.75em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .k-label { font-size: 1.12em; margin: 0.1em 0 0; }
      .k-step-waiting { border-left-color: var(--foreign); }
      .k-step-failed, .k-step-stalled { border-left-color: var(--degraded); }
      .k-step-applied { border-left-color: var(--managed); }
      .k-step-reset { border-left-color: var(--neutral); }
      .k-right { display: grid; gap: 0.6em; align-content: start; }
      .k-strip { list-style: none; display: flex; flex-wrap: wrap; gap: 0.35em; padding: 0; margin: 0; }
      .k-stop { font: 0.82em var(--font-mono); padding: 0.25em 0.7em; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
      .k-done { color: var(--fg); border-color: var(--managed); }
      .k-current { color: var(--bg); background: var(--pending); border-color: var(--pending); font-weight: 600; }
      .k-failed { color: var(--bg); background: var(--degraded); border-color: var(--degraded); font-weight: 600; }
      .k-next { display: flex; flex-wrap: wrap; gap: 0.3em 0.8em; align-items: baseline; font-size: 1.05em; }
      .k-next-word { font: 600 0.72em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .k-action { font-family: var(--font-mono); }
      .k-when { color: var(--foreign); font-family: var(--font-mono); }
      .k-approve { border-left: 4px solid var(--foreign); padding-left: 0.8em; }
      .k-approve p { margin: 0.15em 0; }
      .k-approve-head, .k-approve-then { color: var(--muted); font-size: 0.92em; }
      .k-command { display: block; margin: 0.25em 0; padding: 0.45em 0.7em; background: var(--well); border-radius: 6px; font: 0.88em var(--font-mono); overflow-wrap: anywhere; user-select: none; }
      .k-inline { font-family: var(--font-mono); color: var(--fg); background: var(--well); padding: 0.05em 0.35em; border-radius: 4px; user-select: none; }
      .k-note { color: var(--muted); margin: 0; font-size: 0.92em; }
      .k-unknown { color: var(--foreign); }
      #view { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
      #foot { display: flex; flex-wrap: wrap; gap: 0.2em 1.6em; padding: 0.55em 1.6em; border-top: 1px solid var(--rule); background: var(--panel); font-size: 0.85em; }
      .k-legend { color: var(--muted); flex-basis: 100%; }
      .k-fact { color: var(--fg); }
      .k-source { color: var(--muted); margin-left: auto; }
      @media (max-width: 900px) { #bar { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header id="bar" aria-live="polite"></header>
    <iframe id="view" title="behold's view of the change"></iframe>
    <footer id="foot"></footer>
    <script type="module">
      import { initTheme } from "/theme.js";
      import { startKiosk } from "/kiosk.js";
      initTheme();
      startKiosk({ bar: document.getElementById("bar"), frame: document.getElementById("view"), foot: document.getElementById("foot") });
    </script>
  </body>
</html>
