<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>behold kiosk</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23a6adc8' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='2.2' fill='%23a6adc8'/%3E%3C/svg%3E"
    />
    <style>
      /* #569 step 2. The pre-paint fallback: the kiosk's default theme's
         tokens (KIOSK_THEME in theme.js), which initTheme() replaces with the viewer's theme. */
      :root {
        --bg: #09141b; --panel: #1c2325; --line: #2c2e2d; --fg: #deb88d; --muted: #746a5c;
        --edge: #4d483f; --managed: #027c9b; --foreign: #fca02f; --pending: #1e4950;
        --degraded: #d15123; --neutral: #695e4e; --runtime: #50a3b5;
        --rule: #3d4142; --focus: #364548; --active: #243235; --well: #01070d; --shadow: #010304;
        /* behold#571: the kiosk's surfaces and ink (theme.js kioskSurfaces), the kiosk's default theme's (KIOSK_THEME, Sea Shells) until initTheme() runs. */
        --surface-box: #101b22; --surface-pane-a: #152128; --surface-pane-b: #1b272e; --zebra: #deb88d; --soft: #deb88d; --muted-ink: #7c7365;
        --managed-ink: #0e7f9e; --foreign-ink: #fca02f; --pending-ink: #567b82; --degraded-ink: #d15123; --runtime-ink: #50a3b5;
        --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      /* behold#571: the kiosk's text is the softened ink, its secondary text and state colours the ones held legible on every surface. */
      body { --fg: var(--soft); --muted: var(--muted-ink); --managed: var(--managed-ink); --foreign: var(--foreign-ink); --pending: var(--pending-ink); --degraded: var(--degraded-ink); --runtime: var(--runtime-ink); --zebra-row: color-mix(in srgb, var(--zebra) 3.5%, transparent); }
      /* #569 step 3: one screen. The bar is the narration, the frame is
         behold's own view of the change. behold#571: no footer; the plan's
         facts are in the lead block, the legend over the graph. Sizes follow
         the screen's width, so a TV reads it from across a room. */
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: clamp(13px, 0.82vw, 20px)/1.4 var(--font-ui); overflow: hidden; }
      body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
      #k-head { position: relative; }
      /* #569: the pipeline's runs (left), the selected run's jobs, steps and
         log (middle), behold's view of the change (right). */
      /* behold#571: each pane its own surface, a gap of the page between them. */
      #stage { display: grid; grid-template-columns: minmax(15em, 18%) minmax(26em, 34%) minmax(0, 1fr); gap: 5px; padding: 0 5px; min-height: 0; background: var(--bg); }
      #runs-side { overflow-y: auto; background: var(--surface-pane-b); border-radius: 6px 6px 0 0; }
      #runs-main { overflow: hidden; display: flex; flex-direction: column; min-height: 0; background: var(--surface-pane-a); border-radius: 6px 6px 0 0; }
      #k-runs-toggle { display: none; }
      .r-run:nth-child(even of .r-run), .r-job:nth-child(even of .r-job), .r-log-line:nth-child(even of .r-log-line) { background: var(--zebra-row); }
      /* behold#571: the panes step back from the lead block: quieter heads, lighter rules. */
      .r-side-head { padding: 0.7em 1em 0.4em; }
      .r-side-title { font-weight: 600; font-size: 0.95em; color: var(--muted); }
      .r-side-note { color: var(--muted); font-size: 0.82em; margin-top: 0.15em; }
      .r-runs { list-style: none; margin: 0; padding: 0 0 1em; }
      .r-group { font: 600 0.72em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0.7em 1em 0.25em; }
      .r-run { display: grid; grid-template-columns: 1.2em 1fr; gap: 0.6em; padding: 0.5em 1em; cursor: pointer; border-left: 3px solid transparent; }
      .r-run:hover { background: color-mix(in srgb, var(--active) 50%, transparent); }
      .r-run.r-selected { background: var(--active); border-left-color: var(--focus); }
      .r-run-title { font-weight: 600; line-height: 1.25; }
      .r-run-place { color: var(--muted); font-size: 0.85em; }
      .r-run-meta { display: flex; flex-wrap: wrap; gap: 0 0.7em; color: var(--muted); font-size: 0.8em; }
      .r-icon { width: 1.15em; height: 1.15em; flex: none; margin-top: 0.15em; }
      .r-ok { color: var(--managed); } .r-bad { color: var(--degraded); } .r-wait { color: var(--foreign); } .r-busy { color: var(--foreign); } .r-idle { color: var(--neutral); }
      .r-word.r-idle { color: var(--muted); }
      @media (prefers-reduced-motion: no-preference) { .r-spin { animation: r-spin 1s linear infinite; } }
      @keyframes r-spin { to { transform: rotate(360deg); } }
      .r-head { padding: 0.7em 1em 0.5em; border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
      .r-head-title { display: flex; gap: 0.5em; align-items: center; font-weight: 600; font-size: 1em; }
      .r-head-title .r-icon { margin: 0; }
      .r-head-sub { color: var(--fg); font-size: 0.88em; margin-top: 0.15em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .r-head-meta { color: var(--muted); font-size: 0.82em; }
      .r-label { font: 600 0.7em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0.6em 1em 0; }
      .r-jobs { list-style: none; margin: 0; padding: 0.3em 0 0.5em; border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
      .r-job { display: flex; gap: 0.5em; align-items: center; padding: 0.22em 1em 0.22em calc(1em + var(--depth, 0) * 0.9em); cursor: pointer; }
      .r-job .r-icon { margin: 0; }
      .r-job.r-selected { background: var(--active); }
      .r-job-name { font: 600 0.92em var(--font-mono); }
      .r-job-needs { color: var(--muted); font-size: 0.78em; }
      /* behold#571: the tools a job runs, each its logo and its name. Short of room, the names stay and the logos go. */
      .r-job-head { display: inline-flex; flex-direction: column; flex: none; line-height: 1.15; }
      .r-job-name { white-space: nowrap; flex: none; }
      .r-job-tools { display: inline-flex; gap: 0.6em; font-size: 0.7em; color: var(--muted); white-space: nowrap; }
      .r-tool { display: inline-flex; align-items: center; gap: 0.25em; }
      .r-tool-icon { flex: none; }
      /* behold#571: each root's colour, as a dot by its name; never a text or fill colour, which mean a state. */
      .k-root::before { content: ""; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--k-root); margin: 0 0.28em 0.1em 0.05em; vertical-align: middle; }
      .r-job-roots { display: inline-flex; gap: 0.75em; font-size: 0.82em; color: var(--fg); }
      .r-dur { margin-left: auto; color: var(--muted); font-size: 0.8em; white-space: nowrap; }
      .r-job-skipped { color: var(--muted); font-size: 0.78em; cursor: default; }
      .r-steps { display: flex; flex-direction: column; min-height: 0; flex: 1; overflow-y: auto; padding-bottom: 0.5em; }
      .r-steps-head { display: flex; gap: 0.5em; align-items: center; padding: 0.3em 1em 0.3em; }
      .r-steps-head .r-icon { margin: 0; }
      .r-steps-job { font: 700 0.95em var(--font-mono); }
      .r-steps-word { color: var(--muted); font-size: 0.85em; }
      .r-step-line { display: flex; gap: 0.45em; align-items: center; padding: 0.2em 1em; cursor: pointer; }
      .r-step-line .r-icon { margin: 0; width: 1em; height: 1em; }
      .r-caret { color: var(--muted); width: 0.8em; font-size: 0.8em; }
      .r-step-name { font-size: 0.88em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .r-open > .r-step-line { background: color-mix(in srgb, var(--active) 60%, transparent); }
      .r-log { margin: 0.2em 0.6em 0.4em 1.6em; padding: 0.5em 0; background: var(--surface-pane-b); border-radius: 6px; font: 0.76em/1.45 var(--font-mono);
        white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; max-height: 52vh; min-height: 6em; }
      .r-log-line { display: grid; grid-template-columns: 3.2em 1fr; gap: 0.8em; padding: 0 0.8em 0 0; }
      .r-ln { color: var(--muted); text-align: right; user-select: none; opacity: 0.7; }
      /* behold#571: the runner's set-up lines, folded into one row so terragucci's own lines come first. */
      .r-log-setup { color: var(--muted); padding: 0 0.8em 0.2em 4em; cursor: pointer; user-select: none; }
      .r-log-setup:hover { color: var(--fg); }
      .r-log-quiet .r-lt { color: var(--muted); }
      .r-log-cut { color: var(--muted); padding: 0 0.8em 0.2em 4em; font-style: italic; }
      .r-log-live { color: var(--foreign); padding-left: 4em; }
      @media (prefers-reduced-motion: no-preference) { .r-log-live { animation: r-blink 1s steps(2) infinite; } }
      @keyframes r-blink { 50% { opacity: 0; } }
      .r-note { color: var(--muted); padding: 0 1em; font-size: 0.88em; }
      /* behold#571: a log line's feature: an outlined chip on its first line in the job, a faint dot after; its note opens under the line. */
      .r-ann { font: 600 0.82em var(--font-ui); color: var(--fg); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 0 0.55em; margin-left: 0.3em; cursor: pointer; white-space: nowrap; vertical-align: 0.05em; }
      .r-ann:hover, .r-ann:focus-visible { border-color: var(--focus); }
      .r-ann-dot { display: inline-block; width: 0.55em; height: 0.55em; padding: 0; margin-left: 0.45em; border-radius: 50%; border: 0; background: var(--muted); opacity: 0.55; cursor: pointer; vertical-align: 0.1em; }
      .r-ann-dot:hover { opacity: 1; }
      .r-ann-terragucci { border-color: color-mix(in srgb, var(--pending) 70%, transparent); }
      .r-ann-chant { border-color: color-mix(in srgb, var(--runtime) 70%, transparent); }
      .r-ann-choudoufu, .r-ann-behold { border-color: color-mix(in srgb, var(--foreign) 70%, transparent); }
      .r-ann-dot.r-ann-terragucci { background: var(--pending); } .r-ann-dot.r-ann-chant { background: var(--runtime); }
      .r-ann-note { grid-column: 2; margin: 0.25em 0 0.45em; padding: 0.45em 0.7em; border-left: 3px solid var(--focus); background: var(--surface-box); border-radius: 0 6px 6px 0; font: 1.12em/1.4 var(--font-ui); white-space: normal; }
      .r-ann-note-head { font: 600 0.8em var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 0; }
      .r-ann-note-text { margin: 0.15em 0 0.2em; color: var(--fg); }
      .r-ann-more { color: var(--pending); }
      .r-flash { background: color-mix(in srgb, var(--focus) 30%, transparent) !important; }
      @media (prefers-reduced-motion: no-preference) { .r-flash { transition: background 0.6s; } }
      /* behold#571: folded, whole lines only (fitFeatures); opened, it scrolls inside a bounded box. */
      .r-feats { padding: 0.1em 1em 0.45em; border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
      .r-feats-open .r-feats-list { max-height: 12em; overflow-y: auto; scrollbar-width: thin; }
      .r-feats-label { padding: 0.3em 0 0.15em; }
      .r-feats-list { display: flex; flex-wrap: wrap; gap: 0.3em 0.35em; align-items: center; }
      .r-feats-list > [hidden] { display: none; }
      .r-feats-product { font: 600 0.7em var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 0; margin: 0 0.15em 0 0.4em; }
      .r-feats-product:first-child { margin-left: 0; }
      .r-feat, .r-feats-more { font: 0.8em var(--font-ui); line-height: 1.4; color: var(--fg); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 0.05em 0.6em; cursor: pointer; }
      .r-feats-more { color: var(--pending); border-style: dashed; }
      .r-feat:hover, .r-feat:focus-visible { border-color: var(--focus); background: var(--zebra-row); }
      /*
       * behold#571: the header in fixed boxes. The lead block on the left is
       * the page's lead: the title, the two beats (what changes, and the step:
       * what just happened and why), the progress, the rest of the card and
       * the pull request's facts, each in a box whose height holds its text
       * budget at 1440x900 and 1920x1080 (terragucci#1061: the card's fields
       * 120, 220 and 120 characters, the step 200). More scrolls inside the
       * box, with a fade at the edge, so the panes below never move. The hold
       * panel on the right takes the lead's height and never sets it.
       */
      #bar { position: relative; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 0.4em 0.7em; align-items: stretch;
        padding: 0.3em 0.6em 0.3em; background: var(--bg); }
      #bar > .k-empty, #bar > .k-replay, #bar > .k-nograph-note { grid-column: 1 / -1; }
      :root { --k-title-h: 1.82em; --k-beat-h: 3.25em; --k-step-h: 4.45em; --k-progress-h: 1.5em; --k-card-h: 3.3em; --k-facts-h: 1.2em; }
      /* Wide enough that the step's 200 characters, and Watch for with Shows, take two lines each: their boxes are two lines tall. */
      @media (min-width: 1700px) { :root { --k-step-h: 3.05em; --k-card-h: 2.3em; } }
      .k-lead { display: grid; grid-template-rows: var(--k-title-h) var(--k-beat-h) var(--k-step-h) var(--k-progress-h) var(--k-card-h) var(--k-facts-h) auto; gap: 0.16em; min-width: 0;
        padding: 0.25em 0.8em 0.3em; background: var(--surface-pane-b); border-radius: 8px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 14%, transparent); }
      .k-box { min-height: 0; overflow-y: auto; scrollbar-width: thin; border-radius: 6px; padding: 0.1em 0.2em; }
      .k-box.k-more-below { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 1.3em), transparent); }
      .k-box.k-more-above { -webkit-mask-image: linear-gradient(to top, #000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(to top, #000 calc(100% - 1.3em), transparent); }
      .k-box.k-more-above.k-more-below { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 1.3em, #000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(to bottom, transparent, #000 1.3em, #000 calc(100% - 1.3em), transparent); }
      .k-box-empty { background: transparent; box-shadow: none; }
      .k-box-title { overflow: hidden; padding: 0; }
      .k-kicker { font: 600 0.5em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-right: 0.9em; vertical-align: 0.3em; white-space: nowrap; }
      .k-cycle { color: var(--muted); font: 0.78em var(--font-mono); white-space: nowrap; }
      .k-title { margin: 0; font-size: 1.5em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* The two beats: the largest text after the title, each with its label first. */
      .k-beat, .k-intro { margin: 0; font-size: 1.32em; line-height: 1.22; color: var(--fg); }
      .k-step { margin: 0; font-size: 1.16em; line-height: 1.25; color: var(--fg); }
      .k-beat-text { font-weight: 600; }
      .k-box-beat { padding: 0 0.2em; }
      .k-beat-label, .k-step-word, .k-intro-head { font: 700 0.62em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 0.8em; vertical-align: 0.12em; white-space: nowrap; }
      .k-beat-label, .k-intro-head { color: var(--muted); }
      .k-step-word { color: var(--pending); }
      .k-box-step { border-left: 4px solid var(--pending); border-radius: 0 6px 6px 0; padding: 0.05em 0.2em 0.05em 0.65em; background: color-mix(in srgb, var(--pending) 7%, transparent); }
      .k-box-step:has(.k-step-waiting) { border-left-color: var(--foreign); }
      .k-box-step:has(.k-step-failed), .k-box-step:has(.k-step-stalled) { border-left-color: var(--degraded); }
      .k-box-step:has(.k-step-applied) { border-left-color: var(--managed); }
      .k-box-step:has(.k-step-reset) { border-left-color: var(--neutral); }
      /* The rest of the card, quieter. */
      .k-box-more { padding: 0 0.2em; }
      .k-about { margin: 0; font-size: 0.84em; line-height: 1.3; }
      .k-about-label { font: 600 0.74em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-right: 0.6em; }
      .k-about-text { margin-right: 1.2em; color: color-mix(in srgb, var(--fg) 82%, var(--muted)); }
      .k-muted { color: var(--muted); margin: 0.25em 0; }
      /* The progress, with the step: the strip, the driver's next action, the cycle. */
      .k-progress { display: flex; flex-wrap: nowrap; gap: 0.3em 0.9em; align-items: center; min-width: 0; overflow: hidden; }
      .k-progress .k-strip { flex: none; }
      .k-progress .k-next { flex: 1; }
      .k-strip { list-style: none; display: flex; flex-wrap: nowrap; gap: 0.3em; padding: 0; margin: 0; }
      .k-stop { font: 0.78em var(--font-mono); padding: 0.18em 0.6em; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
      .k-done { color: var(--fg); border-color: var(--managed); }
      .k-current { color: var(--bg); background: var(--pending); border-color: var(--pending); font-weight: 600; }
      .k-failed { color: var(--bg); background: var(--degraded); border-color: var(--degraded); font-weight: 600; }
      .k-next { display: flex; gap: 0.3em 0.6em; align-items: baseline; font-size: 0.95em; min-width: 0; white-space: nowrap; }
      .k-next-word { font: 600 0.72em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .k-action { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .k-when { color: var(--foreign); font-family: var(--font-mono); }
      /* The pull request's facts, one line; the whole line is its title. */
      .k-box-facts { overflow: hidden; padding: 0 0.2em; }
      .k-facts { margin: 0; font-size: 0.86em; line-height: 1.4; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .k-credits { margin: 0; color: var(--muted); font-size: 0.78em; line-height: 1.35; }
      /* behold#571: the hold panel, lit in the waiting tone its job row and its wave box carry. */
      .k-right { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 0.3em; min-width: 0; min-height: 0; contain: size; }
      .k-right > .k-cycle { margin: 0; padding: 0.25em 13em 0 0.3em; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; }
      .k-box-hold { padding: 0.5em 0.9em 0.6em; }
      .k-hold { background: var(--surface-box); border-radius: 8px; }
      .k-hold-head { margin: 0 0 0.3em; font: 700 0.95em var(--font-mono); color: var(--fg); }
      .k-hold-wave { background: color-mix(in srgb, var(--foreign) 7%, var(--surface-box)); box-shadow: inset 4px 0 0 var(--foreign); padding-left: 1.2em; }
      .k-hold-wave .k-hold-head { color: var(--foreign); }
      .k-hold > .k-note { margin-top: 0.2em; }
      /* behold#571: "How this hold ends": four rows that light from the records. */
      .k-ap-head { font: 600 0.7em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.1em; }
      .k-ap-head .k-ap-plan { text-transform: none; letter-spacing: 0; color: var(--fg); font-weight: 400; }
      .k-ap-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.05em; }
      .k-ap-row { display: grid; grid-template-columns: 1em 6.4em minmax(0, 1fr); gap: 0 0.35em; align-items: baseline; font-size: 0.84em; line-height: 1.28; }
      .k-ap-mark { width: 0.75em; height: 0.75em; border-radius: 50%; border: 2px solid var(--muted); display: inline-block; align-self: start; margin-top: 0.25em; }
      .k-ap-lit .k-ap-mark { background: var(--managed); border-color: var(--managed); }
      .k-ap-going .k-ap-mark { border-color: var(--foreign); background: linear-gradient(90deg, var(--foreign) 50%, transparent 50%); }
      .k-ap-label { font: 600 0.82em var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg); }
      .k-ap-dim .k-ap-label, .k-ap-dim .k-ap-text { color: var(--muted); }
      .k-ap-facts { color: var(--muted); font-size: 0.92em; margin-left: 0.35em; }
      .k-ap-bad { color: var(--degraded); }
      .k-ap-row .k-command { grid-column: 3; margin: 0.1em 0; padding: 0.25em 0.6em; font-size: 0.92em; }
      .k-ap .r-ann { font-size: 0.78em; }
      .k-approve p { margin: 0.15em 0; }
      .k-approve-gloss { color: var(--fg); font-size: 0.92em; }
      .k-approve-then { color: var(--muted); font-size: 0.92em; }
      .k-command { display: block; margin: 0.25em 0; padding: 0.45em 0.7em; background: var(--well); border-radius: 6px; font: 0.88em var(--font-mono); overflow-wrap: anywhere; user-select: none; }
      .k-inline { font-family: var(--font-mono); color: var(--fg); background: var(--well); padding: 0.05em 0.35em; border-radius: 4px; user-select: none; }
      .k-note { color: var(--muted); margin: 0; font-size: 0.92em; }
      .k-unknown { color: var(--foreign); }
      #view-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
      #view { display: block; width: 100%; flex: 1; min-height: 0; border: 0; background: var(--bg); }
      /* #571: the toggle between the two views, over the frame by the view's caption. */
      #views { display: flex; align-items: center; gap: 0.9em; padding: 0.45em 1em; border-bottom: 1px solid var(--rule); background: var(--surface-pane-a); border-radius: 6px 6px 0 0; }
      #views[hidden] { display: none; }
      .k-views { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
      .k-view { font: 600 0.85em var(--font-ui); color: var(--muted); background: transparent; border: 0; padding: 0.3em 0.95em; cursor: pointer; }
      .k-view + .k-view { border-left: 1px solid var(--rule); }
      .k-view:hover { color: var(--fg); }
      .k-view-on { color: var(--bg); background: var(--pending); }
      .k-view-on:hover { color: var(--bg); }
      .k-view-note { color: var(--muted); font-size: 0.8em; }
      /* behold#571: "How to read this", the graph pane's static frame: the legend of the view shown, folded to its header on request. */
      #view-pane { position: relative; }
      #views { padding-right: 11em; }
      /* Folded, its header sits in the toggle's row; open, its rows lie over the top of the graph, two to a line. */
      #k-read { font-size: 0.82em; }
      #k-read[hidden] { display: none; }
      .k-read-head { position: absolute; top: 0.55em; right: 1.1em; z-index: 5; font: 600 0.82em var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: transparent; border: 0; padding: 0.35em 0; cursor: pointer; }
      .k-read-head::after { content: " ▸"; }
      .k-read-open .k-read-head::after { content: " ▾"; }
      .k-read-head:hover { color: var(--fg); }
      .k-read-rows { position: absolute; top: 2.85em; left: 0.7em; right: 0.7em; z-index: 4; list-style: none; margin: 0; padding: 0.45em 0.9em; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.25em 1.4em;
        background: var(--surface-pane-b); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 22px color-mix(in srgb, var(--shadow) 60%, transparent); }
      .k-read-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 0.5em; align-items: center; color: var(--fg); line-height: 1.3; }
      .k-read-mark { display: inline-block; justify-self: center; }
      .k-read-card { width: 1.7em; height: 0.95em; border-radius: 3px; background: var(--panel); box-shadow: inset 3px 0 0 var(--muted); border: 1px solid var(--edge); }
      .k-read-box { width: 1.9em; height: 1.05em; border-radius: 4px; border: 1.5px solid var(--muted); }
      .k-read-solid, .k-read-dashed { width: 2em; height: 0; border-top: 2px solid var(--fg); }
      .k-read-dashed { border-top-style: dashed; }
      .k-read-order { width: 1.9em; height: 1em; background: linear-gradient(var(--muted), var(--muted)) 0 0 / 0.5em 100% no-repeat, linear-gradient(var(--muted), var(--muted)) 0.7em 25% / 0.5em 75% no-repeat, linear-gradient(var(--muted), var(--muted)) 1.4em 50% / 0.5em 50% no-repeat; opacity: 0.8; }
      .k-read-marks { width: 1.5em; height: 0.75em; background: radial-gradient(circle at 25% 50%, var(--foreign) 0 0.3em, transparent 0.32em), radial-gradient(circle at 75% 50%, var(--runtime) 0 0.3em, transparent 0.32em); }
      /* behold#571: a tool's page. Its name (and logo where allowed) before the scenario, the replay's banner, the credit. */
      .k-brand { display: inline-flex; align-items: center; gap: 0.35em; margin-right: 0.8em; color: var(--fg); text-decoration: none; font-weight: 700; vertical-align: 0.05em; }
      .k-brand:hover .k-brand-name { text-decoration: underline; }
      .k-brand-logo { width: 1.25em; height: 1.25em; }
      .k-replay { margin: 0; padding: 0.2em 0.7em; padding-right: 16em; border-left: 4px solid var(--neutral); background: var(--surface-box); color: var(--fg); font-size: 0.92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* behold#571: "What is this?" and the theme, at the header's top right, outside the boxes that redraw. */
      #k-tools { position: absolute; top: 0.4em; right: 1em; z-index: 5; display: flex; gap: 0.7em; align-items: center; font-size: 0.8em; }
      .k-what { font: inherit; color: var(--pending); background: transparent; border: 0; padding: 0.1em 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
      #k-what-pop { position: absolute; top: 1.8em; right: 0; width: min(34em, calc(100vw - 32px)); padding: 0.7em 0.9em; background: var(--surface-pane-b); color: var(--fg); border: 1px solid var(--focus);
        border-radius: 8px; box-shadow: 0 6px 24px color-mix(in srgb, var(--shadow) 70%, transparent); font-size: 1.15em; line-height: 1.45; }
      #k-what-pop[hidden] { display: none; }
      #k-what-pop p { margin: 0; }
      #k-what-pop .k-what-more { margin-top: 0.5em; }
      #k-what-pop a { color: var(--focus); }
      .k-menu summary { cursor: pointer; color: var(--muted); list-style: none; }
      .k-menu summary::-webkit-details-marker { display: none; }
      .k-menu summary::after { content: " ▾"; }
      .k-menu[open] summary { color: var(--fg); }
      .k-menu-body { position: absolute; right: 0; top: 1.8em; padding: 0.5em; background: var(--surface-pane-b); border: 1px solid var(--rule); border-radius: 8px; }
      .k-credit { color: var(--muted); }
      .k-credit-link { color: var(--fg); }
      .k-nograph-note { margin: 0; color: var(--muted); font-size: 0.88em; }
      /* With no graph to show, the graph pane folds away and the runs and the log take its width. */
      body.k-nograph #stage { grid-template-columns: minmax(15em, 22%) minmax(0, 1fr); }
      body.k-nograph #view-pane { display: none; }
      /* behold#571: before the tool's first cycle, no runs and no log: those panes fold away, the repo's graph takes the width, or nothing shows below the header. */
      body.k-notyet #runs-side, body.k-notyet #runs-main, body.k-notyet #k-runs-toggle { display: none !important; }
      body.k-notyet #stage { grid-template-columns: minmax(0, 1fr); }
      .k-fact { color: var(--fg); }
      @media (max-width: 900px) and (min-width: 601px) { #bar { grid-template-columns: 1fr; } .k-right { contain: none; } .k-box-hold { max-height: 16em; } #stage, body.k-nograph #stage { grid-template-columns: 1fr; } }
      /*
       * behold#571: a phone. One column that scrolls as a page: the header
       * (its boxes as tall as their text), the graph, then the runs and their
       * logs behind "Runs and logs". Nothing wider than the screen.
       */
      @media (max-width: 600px) {
        html, body { height: auto; overflow-x: hidden; overflow-y: auto; font-size: 14px; }
        body { display: block; }
        #bar { display: block; padding: 0.5em 16px 0.6em; }
        #bar > * + * { margin-top: 0.45em; }
        .k-left, .k-right { display: block; contain: none; }
        .k-left > * + *, .k-right > * + * { margin-top: 0.4em; }
        .k-box { height: auto; max-height: none; overflow: visible; -webkit-mask-image: none !important; mask-image: none !important; }
        .k-box-empty { display: none; }
        .k-title { white-space: normal; font-size: 1.4em; }
        .k-progress { flex-wrap: wrap; overflow: visible; }
        .k-progress .k-strip { flex: 1 1 100%; }
        #views { flex-wrap: wrap; gap: 0.3em 0.9em; }
        .k-strip { flex-wrap: wrap; }
        .k-next { white-space: normal; flex-wrap: wrap; }
        .k-facts { white-space: normal; }
        .k-right > .k-cycle { padding: 0; }
        #k-read { padding: 0.2em 16px; }
        .k-read-head { position: static; }
        .k-read-rows { position: static; grid-template-columns: 1fr; border-radius: 6px; box-shadow: none; margin-bottom: 0.3em; }
        #views { padding-right: 1em; }
        .k-replay { padding-right: 0.7em; white-space: normal; }
        #k-tools { position: static; justify-content: flex-end; margin: 0; padding: 0.4em 16px 0; }
        #k-what-pop { right: 16px; left: 16px; width: auto; top: 2.2em; }
        .k-ap-row { grid-template-columns: 1.1em 5.6em minmax(0, 1fr); }
        #stage, body.k-nograph #stage { display: flex; flex-direction: column; padding: 0; gap: 0; }
        #view-pane { order: 1; height: 64vh; }
        #view-pane:has(#k-read.k-read-open) { height: auto; }
        #view-pane:has(#k-read.k-read-open) #view { height: 56vh; flex: none; }
        body.k-nograph #view-pane { display: none; }
        #k-runs-toggle { order: 2; display: block; margin: 0.6em 16px; padding: 0.6em 1em; font: 600 1em var(--font-ui); color: var(--fg); background: var(--surface-pane-b); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; text-align: left; }
        #k-runs-toggle::after { content: " ▸"; }
        body.k-runs-open #k-runs-toggle::after { content: " ▾"; }
        #runs-side { order: 3; display: none; max-height: 50vh; border-radius: 0; }
        #runs-main { order: 4; display: none; height: 85vh; border-radius: 0; }
        body.k-runs-open #runs-side, body.k-runs-open #runs-main { display: flex; flex-direction: column; }
        body.k-runs-open #runs-side { display: block; }
        .r-log { margin-left: 0.4em; max-height: 60vh; }
        .r-log-line { grid-template-columns: 2.4em 1fr; gap: 0.5em; }
        .r-ann-note { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <div id="k-head">
      <div id="k-tools">
        <button type="button" class="k-what" aria-expanded="false" aria-controls="k-what-pop">What is this?</button>
        <details class="k-menu"><summary>Theme</summary><div class="k-menu-body" id="k-theme"></div></details>
        <div id="k-what-pop" role="dialog" aria-label="What is this?" hidden></div>
      </div>
      <header id="bar" aria-live="polite"></header>
    </div>
    <div id="stage">
      <nav id="runs-side" aria-label="pipeline runs"></nav>
      <section id="runs-main" aria-live="polite"></section>
      <button type="button" id="k-runs-toggle" aria-expanded="false">Runs and logs</button>
      <section id="view-pane">
        <div id="views" hidden></div>
        <section id="k-read" aria-label="How to read this" hidden></section>
        <iframe id="view" title="behold's view of the change"></iframe>
      </section>
    </div>
    <script type="module">
      import { initTheme, KIOSK_THEME } from "/theme.js";
      import { startKiosk } from "/kiosk.js";
      import { pageTool } from "/kiosk-vendor.js";
      initTheme(KIOSK_THEME);
      // behold#571: /<tool> serves this page with its tool in a meta tag; /kiosk has none.
      startKiosk(
        {
          bar: document.getElementById("bar"), frame: document.getElementById("view"), read: document.getElementById("k-read"), side: document.getElementById("runs-side"), main: document.getElementById("runs-main"), views: document.getElementById("views"),
          tools: { what: document.querySelector(".k-what"), pop: document.getElementById("k-what-pop"), theme: document.getElementById("k-theme"), runsToggle: document.getElementById("k-runs-toggle") },
        },
        { tool: pageTool(document) },
      );
    </script>
  </body>
</html>
